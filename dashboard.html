<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6100">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- GATEKEEPER: Runs before anything else loads. Kicks out unauthenticated users instantly. -->
    <script>
        if (!localStorage.getItem('foundry_session')) {
            window.location.replace('/login');
        }
    </script>
<link rel="icon" type="image/png" href="/image/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marketplace | Mova99</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #ff6100;
            --orange-light: #ff8533;
            --orange-pale: #fff3ed;
            --green: #00a650;
            --red: #e02020;
            --blue: #0070f3;
            --text: #1a1a1a;
            --text-muted: #888;
            --border: #f0f0f0;
            --bg: #f5f5f5;
            --white: #ffffff;
            --card-radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* ── Sidebar ─────────────────────────────────────── */
        .sidebar {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 100vh;
            width: 220px;
            position: fixed;
            left: 0; top: 0;
            background: var(--white);
            border-right: 1px solid var(--border);
            z-index: 100;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav items ───────────────────────────────────── */
        .footer-nav-link {
            display: block;
            font-size: 11px;
            color: #888;
            text-decoration: none;
            padding: 7px 16px;
            transition: color .15s, background .15s;
            border-radius: 6px;
        }
        .footer-nav-link:hover {
            color: #ff6100;
            background: #fff3ed;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 20px;
            font-size: 13px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            border-radius: 8px;
            margin: 2px 10px;
            transition: all 0.18s ease;
            letter-spacing: 0;
            text-transform: none;
        }
        .nav-item:hover {
            background: var(--orange-pale);
            color: var(--orange);
        }
        .nav-item.active {
            background: var(--orange-pale);
            color: var(--orange);
            font-weight: 700;
        }
        .nav-item.active::before { display: none; }
        .nav-item.active::after  { display: none; }

        /* ── Main content ────────────────────────────────── */
        .main-content {
            margin-left: 220px;
            padding: 32px 28px;
            transition: margin 0.3s ease;
            min-height: 100vh;
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
                box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            }
            .sidebar.active { transform: translateX(0); }
            .main-content {
                margin-left: 0;
                padding-top: 90px !important;
                padding-bottom: 88px !important;
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        /* ── Product grid ────────────────────────────────── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        @media (min-width: 640px)  { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; } }
        @media (min-width: 1280px) { .product-grid { grid-template-columns: repeat(5, 1fr); gap: 12px; } }

        /* ── Product card — Temu style ───────────────────── */
        .product-card {
            background: var(--white);
            border-radius: var(--card-radius);
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: box-shadow 0.22s ease, border-color 0.22s ease;
            overflow: hidden;
            cursor: pointer;
        }
        .product-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            border-color: var(--border);
        }
        .product-card img {
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            width: 100%;
            display: block;
        }
        .product-card img.loaded { opacity: 1; }
        img.product-img { opacity: 0; transition: opacity .4s ease; }
        img.product-img.loaded { opacity: 1 !important; }
        img.product-img.loaded { opacity: 1 !important; }
        img.product-img { opacity: 0; transition: opacity .4s ease; }
        .product-card:hover img { transform: scale(1.03); }

        .product-name {
            font-size: 11px;
            line-height: 14px;
            height: 28px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-weight: 400;
            color: var(--text);
            margin-top: 6px;
            letter-spacing: 0;
            text-transform: none;
        }

        /* Price in orange like Temu */
        .product-card .text-\[10px\] {
            color: var(--orange) !important;
            font-weight: 700 !important;
            font-size: 14px !important;
        }

        /* ── Search bar ──────────────────────────────────── */
        .search-bar {
            width: 100%;
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: 400;
            color: var(--text);
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
        }
        .search-bar::placeholder { color: #aaa; }
        .search-bar:focus { border-color: var(--orange); }

        /* ── Filter glass ────────────────────────────────── */
        .filter-glass {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        #filterSection {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        #filterSection.active {
            max-height: 500px;
            opacity: 1;
            margin-bottom: 1.5rem;
        }

        /* ── Buttons ─────────────────────────────────────── */
        button { font-family: 'Inter', sans-serif; }

        /* Primary orange search button */
        .search-btn {
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 24px;
            padding: 11px 28px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .search-btn:hover { background: var(--orange-light); }

        /* Add to Cart — Temu circular + button */
        .add-btn {
            background: var(--white);
            border: 1.5px solid var(--orange);
            color: var(--orange);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.18s ease;
            width: 100%;
        }
        .add-btn:hover, .add-btn.added {
            background: var(--orange);
            color: white;
        }

        /* Checkout/primary button */
        .bg-black {
            background: var(--orange) !important;
            border-radius: 24px !important;
            border: none !important;
            font-weight: 700 !important;
        }
        .hover\:bg-black:hover  { background: var(--orange-light) !important; }
        .hover\:bg-gray-800:hover { background: var(--orange-light) !important; }

        /* ── Mobile header ───────────────────────────────── */
        .mobile-header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 110;
        }

        /* ── Cart bubble ─────────────────────────────────── */
        .cart-bubble {
            background: var(--orange);
            border-radius: 50%;
            box-shadow: 0 2px 10px rgba(255,97,0,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cart-bubble:hover {
            transform: scale(1.08);
            box-shadow: 0 4px 18px rgba(255,97,0,0.5);
        }

        /* ── Top header bar (Temu style orange banner) ───── */
        .top-banner {
            background: linear-gradient(90deg, var(--orange) 0%, #ff8533 100%);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        /* ── Category chips (like Temu tabs) ─────────────── */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--white);
            border: 1.5px solid var(--border);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.18s;
        }
        .chip:hover, .chip.active {
            background: var(--orange-pale);
            border-color: var(--orange);
            color: var(--orange);
        }

        /* ── Product section headers ─────────────────────── */
        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }
        .section-title .accent { color: var(--orange); }

        /* ── Greeting area ───────────────────────────────── */
        #greeting-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--orange);
            letter-spacing: 0;
            text-transform: none;
        }

        /* ── Inputs in dark contexts ─────────────────────── */
        input, select, textarea {
            font-family: 'Inter', sans-serif;
        }

        /* ── Modal ───────────────────────────────────────── */
        #productModal {
            background: rgba(0,0,0,0.6);
        }
        #productModal > div {
            background: var(--white);
            border-radius: 16px;
            border: none;
            color: var(--text);
        }

        /* Variant buttons */
        .variant-btn {
            background: var(--white);
            border: 1.5px solid var(--border) !important;
            color: var(--text);
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.18s;
        }
        .variant-btn:hover, .variant-btn.border-black {
            border-color: var(--orange) !important;
            color: var(--orange) !important;
            background: var(--orange-pale) !important;
        }

        /* ── Scrollbar ───────────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 2px; }

        /* ── Animations ──────────────────────────────────── */
        .fade-in {
            animation: fadeUp 0.35s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Text overrides ──────────────────────────────── */
        .text-gray-400, .text-gray-500 { color: #999 !important; }
        .text-blue-500  { color: var(--blue) !important; }
        .text-green-600 { color: var(--green) !important; }
        .text-red-500   { color: var(--red) !important; }
        .text-black     { color: var(--text) !important; }
        .border-black   { border-color: var(--orange) !important; }
        .bg-gray-50     { background: #fafafa !important; }
        .bg-gray-100    { background: var(--border) !important; }
        .bg-white       { background: var(--white) !important; }

        /* ── Price gradient badge (sale style) ───────────── */
        .sale-badge {
            display: inline-block;
            background: var(--orange);
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        /* ── Custom Checkbox Styling ─────────────────────── */
        .cart-item-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--orange);
            border-radius: 4px;
            background: var(--white);
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .cart-item-checkbox:checked {
            background: var(--orange);
            border-color: var(--orange);
        }
        .cart-item-checkbox:checked::after {
            content: '✓';
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        .cart-item-checkbox:hover {
            box-shadow: 0 0 8px rgba(255, 97, 0, 0.3);
        }
        .cart-item-checkbox:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Cart Item Selection State ───────────────────── */
        .cart-item-unselected {
            opacity: 0.6;
            background: #fafafa !important;
        }

        /* Sidebar logo */
        /* ── Bottom Navigation Bar ── */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 68px;
            background: #ffffff;
            border-top: 1px solid #f0f0f0;
            z-index: 200;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }
        .bottom-nav-items {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            padding: 0 8px;
        }
        .bottom-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 12px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 12px;
            transition: all .2s;
            min-width: 56px;
            position: relative;
        }
        .bottom-nav-btn svg { width: 24px; height: 24px; stroke: #aaa; transition: stroke .2s; }
        .bottom-nav-btn span { font-size: 9px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: .04em; transition: color .2s; }
        .bottom-nav-btn.active svg { stroke: #ff6100; }
        .bottom-nav-btn.active span { color: #ff6100; }
        .bottom-nav-btn.active { background: #fff3ed; }
        .bottom-nav-badge {
            position: absolute;
            top: 4px; right: 8px;
            background: #ef4444;
            color: white;
            font-size: 8px;
            font-weight: 900;
            border-radius: 50%;
            width: 16px; height: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        @media (display-mode: standalone) {
            .bottom-nav { display: flex !important; }
            .mobile-header { display: none !important; }
            .main-content {
                padding-bottom: 88px !important;
                padding-top: 16px !important;
                margin-left: 0 !important;
                width: 100% !important;
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
        }
        .sidebar-logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--orange);
            letter-spacing: -0.5px;
            font-style: italic;
        }

        /* ── Nav bottom tabs (Temu bottom nav look on mobile) */
        @media (max-width: 1024px) {
            .nav-item {
                font-size: 13px;
                padding: 12px 16px;
                text-transform: none;
                letter-spacing: 0;
            }
        }

        /* ── Input focus orange ──────────────────────────── */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--orange) !important;
            box-shadow: 0 0 0 2px rgba(255,97,0,0.12) !important;
        }
    </style>


    <script>
        // HARDENED LOGOUT: Clears all browser storage and prevents back-button return
        // 5-minute inactivity timeout
        let inactivityTimer;
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                triggerLogout();
            }, 5 * 60 * 1000); // 5 minutes
        }
        ['click', 'touchstart', 'keypress', 'scroll', 'mousemove'].forEach(evt => {
            document.addEventListener(evt, resetInactivityTimer, { passive: true });
        });
        resetInactivityTimer();

        // ── CART SELECTION STATE ──────────────────────────
        let cartItemsSelected = {}; // Track which items are selected: {pid: true/false}

        async function startCheckout() {
            const session = JSON.parse(localStorage.getItem('foundry_session')) || {};
            const btn = document.querySelector('[onclick="startCheckout()"]');
            if (btn) { btn.textContent = 'Processing...'; btn.disabled = true; }

            // Only include selected items in checkout
            const selectedItems = cart.filter(i => cartItemsSelected[i.pid] === true);
            
            if (selectedItems.length === 0) {
                alert('Please select at least one item to checkout.');
                if (btn) { btn.textContent = 'Checkout'; btn.disabled = false; }
                return;
            }

            try {
                const response = await fetch('/api/create-checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: selectedItems, userId: session.id || '' })
                });
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('Checkout failed: ' + (data.error || 'Please try again.'));
                    if (btn) { btn.textContent = 'Checkout'; btn.disabled = false; }
                }
            } catch (e) {
                alert('Checkout error. Please check your connection and try again.');
                if (btn) { btn.textContent = 'Checkout'; btn.disabled = false; }
            }
        }

        function triggerLogout() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('/login');
        }

        let currentPage = 1;
        let isLoading = false;
        let cart = JSON.parse(localStorage.getItem('mova_cart')) || [];

    function imgUrl(url) {
        if (!url || url.startsWith('data:') || url.startsWith('blob:')) return url || '';
        return '/api/get-orders?img=' + encodeURIComponent(url);
    }

        function toggleMenu() {
            document.querySelector('.sidebar').classList.toggle('active');
        }

        function toggleFilters() {
            document.getElementById('filterSection').classList.toggle('active');
        }

        // Unified search: reads keyword + all filter inputs at once
        function executeGlobalSearch() {
            const keyword = document.getElementById('productSearch').value;
            loadMovaProducts(keyword, true);
        }

        function updateCartBadge() {
            const count = cart.length;
            ['cart-badge', 'cart-badge-desktop'].forEach(id => {
                const badge = document.getElementById(id);
                if (!badge) return;
                if (count > 0) { badge.textContent = count > 99 ? '99+' : count; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            });
        }

        function removeFromCart(pid) {
            cart = cart.filter(i => i.pid !== pid);
            delete cartItemsSelected[pid]; // Remove from selection state
            localStorage.setItem('mova_cart', JSON.stringify(cart));
            updateCartBadge();
            // Live refresh cart if on cart page
            if (document.querySelector('[data-nav="cart"]')?.classList.contains('active')) showCartView();
            //showCartView();
        }

        // Toggle item selection for checkout
        function toggleCartItemSelection(pid) {
            cartItemsSelected[pid] = !cartItemsSelected[pid];
            updateCheckoutSummary();
            const itemEl = document.getElementById('cart-item-' + pid.replace(/'/g,''));
            if (itemEl) {
                if (cartItemsSelected[pid]) {
                    itemEl.classList.remove('cart-item-unselected');
                } else {
                    itemEl.classList.add('cart-item-unselected');
                }
            }
        }

        function updateCheckoutSummary() {
            const selectedItems = cart.filter(i => cartItemsSelected[i.pid] === true);
            const subtotal = selectedItems.reduce((sum, i) => sum + parseFloat(i.price), 0);
            const shipping = selectedItems.length > 0 ? 5.20 : 0;
            const total = (subtotal + shipping).toFixed(2);

            const subtotalEl = document.getElementById('checkout-subtotal');
            const shippingEl = document.getElementById('checkout-shipping');
            const totalEl = document.getElementById('checkout-total');
            const itemsCountEl = document.getElementById('selected-items-count');

            if (subtotalEl) subtotalEl.textContent = '$' + subtotal.toFixed(2);
            if (shippingEl) shippingEl.textContent = shipping > 0 ? '$' + shipping.toFixed(2) : '$0.00';
            if (totalEl) totalEl.textContent = '$' + total;
            if (itemsCountEl) itemsCountEl.textContent = selectedItems.length;
        }

        // Pending changes store {pid: {qty, color, size}}
        var _cartPending = {};

        function cartQtyChange(pid, delta) {
            const item = cart.find(i => i.pid === pid);
            if (!item) return;
            const safePid = pid.replace(/'/g,'');
            // Initialize pending from current cart
            if (!_cartPending[pid]) _cartPending[pid] = { qty: item.qty || 1 };
            const newQty = Math.max(1, (_cartPending[pid].qty || 1) + delta);
            _cartPending[pid].qty = newQty;
            // Update qty display
            const qtyEl = document.getElementById('qty-' + safePid);
            if (qtyEl) qtyEl.textContent = newQty;
            // Update price preview
            const unitPrice = parseFloat(item.price) / (item.qty || 1);
            const priceEl = document.getElementById('price-' + safePid);
            if (priceEl) priceEl.textContent = '$' + (unitPrice * newQty).toFixed(2);
            // Show UPDATE button
            const updateBtn = document.getElementById('update-btn-' + safePid);
            if (updateBtn) { updateBtn.style.display = 'inline-block'; updateBtn.style.animation = 'none'; }
        }

        function saveCartItemUpdate(pid) {
            const item = cart.find(i => i.pid === pid);
            if (!item) return;
            const safePid = pid.replace(/'/g,'');
            const pending = _cartPending[pid];
            if (!pending) return;
            const unitPrice = parseFloat(item.price) / (item.qty || 1);
            if (pending.qty) {
                item.qty = pending.qty;
                item.price = (unitPrice * pending.qty).toFixed(2);
            }
            delete _cartPending[pid];
            localStorage.setItem('mova_cart', JSON.stringify(cart));
            // Flash UPDATE button green then hide
            const btn = document.getElementById('update-btn-' + safePid);
            if (btn) {
                btn.textContent = 'Saved ✓';
                btn.style.background = '#22c55e';
                setTimeout(function() {
                    showCartView(); // full re-render with updated totals
                }, 800);
            }
        }

        function updateCartItemQty(pid, delta) {
            const item = cart.find(i => i.pid === pid);
            if (!item) return;
            const baseQty = item.qty || 1;
            const unitPrice = parseFloat(item.price) / baseQty;
            const newQty = Math.max(1, baseQty + delta);
            item.qty = newQty;
            item.price = (unitPrice * newQty).toFixed(2);
            localStorage.setItem('mova_cart', JSON.stringify(cart));
            showCartView();
        }

        function showCartView() {
            const main = document.querySelector('.main-content');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        async function generateReferralCode() {
            const session = JSON.parse(localStorage.getItem('foundry_session')) || {};
            if (!session.id) return;
            // Generate a random code
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = 'MOVA-';
            for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
            try {
                const r = await fetch('/api/get-user?action=update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: session.id, field: 'referralCode', value: code })
                });
                const d = await r.json();
                if (d.success) showSettingsView(); // refresh
            } catch(e) {}
        }

        async function saveField(field) {
            const session = JSON.parse(localStorage.getItem('foundry_session')) || {};
            const el = document.getElementById('sf-' + field);
            const msgEl = document.getElementById('sf-msg');
            if (!el || !el.value.trim()) {
                msgEl.textContent = 'Enter a value first.';
                msgEl.style.color = '#ef4444';
                msgEl.style.display = 'block';
                return;
            }
            const btn = document.getElementById('sf-btn-' + field);
            if (btn) { btn.textContent = 'Saving...'; btn.disabled = true; }
            try {
                const r = await fetch('/api/get-user?action=update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: session.id, field, value: el.value.trim() })
                });
                const d = await r.json();
                if (d.success) {
                    msgEl.textContent = field.charAt(0).toUpperCase() + field.slice(1).replace('N',' N') + ' updated!';
                    msgEl.style.color = '#22c55e';
                    msgEl.style.display = 'block';
                    setTimeout(() => msgEl.style.display = 'none', 3000);
                } else {
                    msgEl.textContent = d.error || 'Update failed.';
                    msgEl.style.color = '#ef4444';
                    msgEl.style.display = 'block';
                }
            } catch(e) {
                msgEl.textContent = 'Connection error.';
                msgEl.style.color = '#ef4444';
                msgEl.style.display = 'block';
            }
            if (btn) { btn.textContent = 'Save'; btn.disabled = false; }
        }

        async function savePwChange() {
            const session = JSON.parse(localStorage.getItem('foundry_session')) || {};
            const oldPw = document.getElementById('pw-old').value;
            const newPw = document.getElementById('pw-new').value;
            const cnfPw = document.getElementById('pw-cnf').value;
            const msgEl = document.getElementById('pw-msg');
            if (!oldPw || !newPw || !cnfPw) { msgEl.textContent = 'Fill in all fields.'; msgEl.style.color = '#ef4444'; msgEl.style.display = 'block'; return; }
            if (newPw !== cnfPw) { msgEl.textContent = 'New passwords do not match.'; msgEl.style.color = '#ef4444'; msgEl.style.display = 'block'; return; }
            if (newPw.length < 6) { msgEl.textContent = 'Min 6 characters.'; msgEl.style.color = '#ef4444'; msgEl.style.display = 'block'; return; }
            const btn = document.getElementById('pw-btn');
            btn.textContent = 'Saving...'; btn.disabled = true;
            try {
                const r = await fetch('/api/get-user?action=change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: session.id, oldPassword: oldPw, newPassword: newPw })
                });
                const d = await r.json();
                if (d.success) {
                    msgEl.textContent = 'Password changed successfully!';
                    msgEl.style.color = '#22c55e';
                    document.getElementById('pw-old').value = '';
                    document.getElementById('pw-new').value = '';
                    document.getElementById('pw-cnf').value = '';
                } else {
                    msgEl.textContent = d.error || 'Failed.';
                    msgEl.style.color = '#ef4444';
                }
                msgEl.style.display = 'block';
            } catch(e) { msgEl.textContent = 'Connection error.'; msgEl.style.color = '#ef4444'; msgEl.style.display = 'block'; }
            btn.textContent = 'Update Password'; btn.disabled = false;
        }

        async function showSupportView() {
            const main = document.querySelector('.main-content');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-support').classList.add('active');
            document.querySelector('.sidebar').classList.remove('active');
            window.scrollTo({ top: 0, behavior: 'instant' });

            main.innerHTML = '<div class="flex items-center justify-center min-h-[50vh]"><p class="text-[9px] font-800 uppercase">Support Center Coming Soon...</p></div>';
        }

        async function loadMovaProducts(keyword = '', reset = false) {
            if (reset) currentPage = 1;
            if (isLoading) return;
            isLoading = true;

            const url = keyword ? '/api/products/search?keyword=' + encodeURIComponent(keyword) + '&page=' + currentPage : '/api/products?page=' + currentPage;

            try {
                const response = await fetch(url);
                const data = await response.json();
                const products = data.products || [];

                if (reset) {
                    document.querySelector('.product-grid').innerHTML = '';
                }

                const grid = document.querySelector('.product-grid');
                products.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${imgUrl(p.image)}" class="product-img" onload="this.classList.add('loaded')">
                        <p class="product-name">${p.name}</p>
                        <p class="text-[10px]">$${p.price}</p>
                        <button onclick="openProductDetails('${p.pid}', '${p.name}', '${p.price}', '${p.image}')" class="add-btn">Add to Cart</button>
                    `;
                    grid.appendChild(card);
                });

                currentPage++;
            } catch (e) {
                console.error('Product load error:', e.message);
            }
            isLoading = false;
        }

        function openProductDetails(pid, name, price, image, color = '', editMode = false) {
            // Product details modal logic
            console.log('Opening product:', pid);
        }

        function showProductView() {
            const main = document.querySelector('.main-content');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.bottom-nav-btn').forEach(el => el.classList.remove('active'));
            document.querySelector('[data-nav="shop"]').classList.add('active');
            document.querySelector('.sidebar').classList.remove('active');
            main.innerHTML = '<div class="product-grid"></div>';
            loadMovaProducts();
        }
