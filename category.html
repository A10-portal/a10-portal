<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff6100">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="/image/logo.png">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TK7Y07K9VH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TK7Y07K9VH');
    </script>
    <title>Shop — Mova99</title>
    <meta name="description" content="Shop products at Mova99 — fast USA delivery, unbeatable prices.">
    <meta property="og:title" content="Shop — Mova99">
    <meta property="og:description" content="Shop millions of products at Mova99 with fast USA delivery.">
    <meta property="og:url" content="https://www.mova99.com">
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --orange:#ff6100; --orange-light:#ff8533; --orange-pale:#fff3ed; --text:#1a1a1a; --border:#f0f0f0; --bg:#f5f5f5; --white:#ffffff; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { background: #f5f5f5; }
        body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
        .product-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
        @media(min-width:640px) { .product-grid { grid-template-columns:repeat(3,1fr); gap:10px; } }
        @media(min-width:1024px) { .product-grid { grid-template-columns:repeat(4,1fr); gap:12px; } }
        @media(min-width:1280px) { .product-grid { grid-template-columns:repeat(5,1fr); gap:12px; } }
        .product-card { background:#fff; border-radius:12px; border:1px solid transparent; display:flex; flex-direction:column; overflow:hidden; cursor:pointer; transition:box-shadow .22s,border-color .22s; }
        .product-card:hover { box-shadow:0 4px 20px rgba(0,0,0,.10); border-color:var(--border); }
        img.product-img { opacity:0; transition:opacity .4s ease; width:100%; display:block; }
        img.product-img.loaded { opacity:1; }
        .product-card:hover img { transform:scale(1.03); }
        .fade-in { animation:fadeUp .35s ease both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
        .cart-float { position:fixed; bottom:88px; right:20px; z-index:500; background:var(--orange); border-radius:50%; width:56px; height:56px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(255,97,0,.4); cursor:pointer; transition:transform .2s; }
        .cart-float:hover { transform:scale(1.1); }
        .skeleton { background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; border-radius:8px; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
        .top-bar { background:#fff; border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; }
    </style>
    <script type="text/javascript" src="https://api.goaffpro.com/loader.js?shop=ennuikskcu"></script>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
    <a href="/dashboard" style="display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
    </a>
    <h1 id="category-title" style="font-size:16px;font-weight:800;color:var(--text);flex:1">Loading...</h1>
    <a href="/dashboard" style="font-size:13px;font-weight:700;color:var(--orange);text-decoration:none;font-style:italic">Mova99</a>
</div>

<!-- Main -->
<main style="padding:16px;padding-bottom:100px">
    <div id="product-grid" class="product-grid">
        <!-- Skeleton loaders -->
        <div class="skeleton" style="height:220px;border-radius:12px"></div>
        <div class="skeleton" style="height:220px;border-radius:12px"></div>
        <div class="skeleton" style="height:220px;border-radius:12px"></div>
        <div class="skeleton" style="height:220px;border-radius:12px"></div>
        <div class="skeleton" style="height:220px;border-radius:12px"></div>
        <div class="skeleton" style="height:220px;border-radius:12px"></div>
    </div>
    <div id="load-more" style="text-align:center;padding:24px;display:none">
        <div class="skeleton" style="height:44px;width:160px;margin:auto;border-radius:24px"></div>
    </div>
</main>

<!-- Floating Cart -->
<div class="cart-float" onclick="goToCart()">
    <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
    </svg>
    <span id="cart-badge" style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;font-weight:900;border-radius:50%;width:18px;height:18px;display:none;align-items:center;justify-content:center">0</span>
</div>

<!-- Stripe Embedded Checkout Modal -->
<div id="stripeCheckoutModal" style="display:none"></div>

<script>
const CATEGORY_MAP = {
    'kids-shoes': { name: "Kids' Shoes", keyword: 'kids shoes' },
    'womens-lingerie': { name: "Women's Lingerie", keyword: 'women lingerie' },
    'arts-crafts': { name: 'Arts & Crafts', keyword: 'art craft sewing' },
    'beauty-health': { name: 'Beauty & Health', keyword: 'beauty makeup' },
    'kids-fashion': { name: "Kids' Fashion", keyword: 'kids clothing' },
    'bags-luggage': { name: 'Bags & Luggage', keyword: 'bags luggage handbag' },
    'womens-clothing': { name: "Women's Clothing", keyword: 'women dress' },
    'appliances': { name: 'Appliances', keyword: 'home appliances kitchen' },
    'womens-shoes': { name: "Women's Shoes", keyword: 'women shoes boots' },
    'jewelry-accessories': { name: 'Jewelry & Accessories', keyword: 'jewelry accessories' },
    'home-kitchen': { name: 'Home & Kitchen', keyword: 'home kitchen bedding' },
    'pet-supplies': { name: 'Pet Supplies', keyword: 'pet supplies' },
    'mens-shoes': { name: "Men's Shoes", keyword: 'men shoes sneakers' },
    'mens-clothing': { name: "Men's Clothing", keyword: 'men shirt jacket' },
    'business-science': { name: 'Business & Science', keyword: 'tools equipment' },
    'automotive': { name: 'Automotive', keyword: 'car accessories automotive' },
    'office-supplies': { name: 'Office Supplies', keyword: 'office supplies stationery' },
    'toys-games': { name: 'Toys & Games', keyword: 'toys games kids' },
    'womens-curve': { name: "Women's Curve", keyword: 'plus size women clothing' },
    'smart-home': { name: 'Smart Home', keyword: 'smart home devices' },
    'baby-maternity': { name: 'Baby & Maternity', keyword: 'baby care nursery' },
    'mens-big-tall': { name: "Men's Big & Tall", keyword: 'men plus size clothing' },
    'cell-phones': { name: 'Cell Phones', keyword: 'phone accessories cell' },
    'sports-outdoors': { name: 'Sports & Outdoors', keyword: 'sports fitness activewear' },
    'musical-instruments': { name: 'Musical Instruments', keyword: 'musical instruments' },
    'patio-garden': { name: 'Patio & Garden', keyword: 'garden outdoor patio' },
    'electronics': { name: 'Electronics', keyword: 'electronics headphones computer' },
    'tools-home-improvement': { name: 'Tools & Home Improvement', keyword: 'tools hardware' },
    'beachwear': { name: 'Beachwear', keyword: 'bikini swimsuit beachwear' },
    'health-household': { name: 'Health & Household', keyword: 'health household cleaning' },
    'food-grocery': { name: 'Food & Grocery', keyword: 'food grocery snacks' },
    'books-media': { name: 'Books & Media', keyword: 'books media' },
    'mens-underwear': { name: "Men's Underwear", keyword: 'men underwear socks' }
};

let cart = JSON.parse(localStorage.getItem('mova_cart')) || [];

// ── Keep cart in sync across tabs/pages — fires when another tab changes localStorage ──
window.addEventListener('storage', (e) => {
    if (e.key === 'mova_cart') {
        cart = JSON.parse(e.newValue || '[]');
        updateCartBadge();
    }
});
let currentPage = 1;
let isLoading = false;
let categorySlug = '';
let categoryKeyword = '';

function imgUrl(url) {
    if (!url || url.startsWith('data:') || url.startsWith('blob:')) return url || '';
    return '/api/get-orders?img=' + encodeURIComponent(url);
}

function updateCartBadge() {
    const items = Array.isArray(cart) ? cart : [];
    const badge = document.getElementById('cart-badge');
    if (!badge) return;
    if (items.length > 0) { badge.textContent = items.length > 99 ? '99+' : items.length; badge.style.display = 'flex'; }
    else { badge.style.display = 'none'; }
}

function addToCart(pid, name, price, image) {
    const cartArr = JSON.parse(localStorage.getItem('mova_cart')) || [];
    if (!cartArr.find(i => i.pid === pid)) {
        cartArr.push({ pid, name, price, image, qty: 1 });
        localStorage.setItem('mova_cart', JSON.stringify(cartArr));
        cart = cartArr;
    }
    updateCartBadge();
    // Flash button green
    document.querySelectorAll('[data-pid="' + pid + '"]').forEach(b => {
        b.style.background = '#22c55e';
        b.innerHTML = '<span style="font-size:14px">✓</span><span>Added!</span>';
        setTimeout(() => {
            b.style.background = '#ff6100';
            b.innerHTML = '<span style="font-size:14px">🛒</span><span>Add to Cart</span>';
        }, 1000);
    });
}

function goToCart() {
    const session = JSON.parse(localStorage.getItem('foundry_session'));
    if (!session) {
        // Save cart and redirect to login
        window.location.href = '/login?redirect=/dashboard';
        return;
    }
    window.location.href = '/dashboard';
}

async function loadProducts(page = 1) {
    if (isLoading) return;
    isLoading = true;
    const grid = document.getElementById('product-grid');

    if (page === 1) {
        grid.innerHTML = Array(6).fill('<div class="skeleton" style="height:240px;border-radius:12px"></div>').join('');
    }

    try {
        const r = await fetch('/api/get-products?keyword=' + encodeURIComponent(categoryKeyword) + '&page=' + page + '&pageSize=20');
        const d = await r.json();
        const products = Array.isArray(d) ? d : (d.products || []);

        if (page === 1) grid.innerHTML = '';

        if (products.length === 0 && page === 1) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px"><p style="font-size:14px;color:#888">No products found in this category</p><a href="/dashboard" style="display:inline-block;margin-top:16px;padding:12px 24px;background:#ff6100;color:#fff;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700">Back to Marketplace</a></div>';
            return;
        }

        products.forEach(product => {
            const cartArr = JSON.parse(localStorage.getItem('mova_cart')) || [];
            const isAdded = cartArr.some(item => item.pid === product.pid);
            const showFire = Math.random() < 0.75;
            const fakeOriginal = showFire ? (parseFloat(product.sellPrice) * (1.3 + Math.random() * 0.4)).toFixed(2) : null;
            const pName = (product.productNameEn || product.productName).replace(/'/g,'').replace(/"/g,'');

            const card = document.createElement('div');
            card.className = 'product-card fade-in';
            card.innerHTML = `
                <div style="position:relative">
                    ${showFire ? '<div style="position:absolute;top:8px;left:8px;z-index:2;background:#ff6100;color:#fff;font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px">🔥 HOT</div>' : ''}
                    <div style="aspect-ratio:1;background:#f8f8f8;overflow:hidden">
                        <img src="${imgUrl(product.productImage)}"
                             onload="this.classList.add('loaded')"
                             onerror="this.style.opacity='0.3'"
                             loading="lazy"
                             style="width:100%;height:100%;object-fit:cover"
                             class="product-img">
                    </div>
                    <div style="padding:8px 10px 4px">
                        <h4 style="font-size:11px;line-height:14px;height:28px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:#1a1a1a;margin:0 0 6px">${product.productNameEn || product.productName}</h4>
                        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
                            <span style="font-size:16px;font-weight:800;color:#ff6100">$${product.sellPrice}</span>
                            ${fakeOriginal ? `<span style="font-size:11px;color:#bbb;text-decoration:line-through">$${fakeOriginal}</span>` : ''}
                            ${showFire ? `<span style="font-size:9px;font-weight:800;color:#ff6100;background:#fff3ed;padding:2px 5px;border-radius:3px">${Math.floor(15+Math.random()*40)}% OFF</span>` : ''}
                        </div>
                    </div>
                </div>
                <div style="padding:6px 10px 10px;margin-top:auto">
                    <button
                        data-pid="${product.pid}"
                        onclick="addToCart('${product.pid}', '${pName}', '${product.sellPrice}', '${product.productImage}')"
                        style="width:100%;padding:10px;border:none;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;background:${isAdded ? '#1a1a1a' : '#ff6100'};color:#fff"
                        ${isAdded ? 'disabled' : ''}>
                        <span style="font-size:14px">${isAdded ? '✓' : '🛒'}</span>
                        <span>${isAdded ? 'Added' : 'Add to Cart'}</span>
                    </button>
                </div>`;
            grid.appendChild(card);
        });

        currentPage = page + 1;
        document.getElementById('load-more').style.display = products.length >= 20 ? 'block' : 'none';
    } catch(e) {
        console.error(e);
        if (page === 1) grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px"><p style="color:#888">Failed to load products</p></div>';
    } finally { isLoading = false; }
}

// Init
window.addEventListener('DOMContentLoaded', () => {
    const path = window.location.pathname.replace('/', '');
    const cat = CATEGORY_MAP[path] || { name: 'Products', keyword: path.replace(/-/g,' ') };
    categorySlug = path;
    categoryKeyword = cat.keyword;

    // Update page title and SEO
    document.getElementById('category-title').textContent = cat.name;
    document.title = cat.name + ' — Mova99';
    document.querySelector('meta[name="description"]').setAttribute('content', 'Shop ' + cat.name + ' at Mova99 — fast USA delivery, unbeatable prices.');
    document.querySelector('meta[property="og:title"]').setAttribute('content', cat.name + ' — Mova99');

    cart = JSON.parse(localStorage.getItem('mova_cart')) || [];
    updateCartBadge();
    loadProducts(1);

    // Infinite scroll
    window.addEventListener('scroll', () => {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
            loadProducts(currentPage);
        }
    });
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
