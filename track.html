<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff6100">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Track Order | Mova99</title>
<link rel="icon" type="image/png" href="/image/logo.png">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-TK7Y07K9VH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-TK7Y07K9VH');</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ff6100;border-radius:2px}

/* Header */
.header{background:#111;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:2px solid #ff6100}
.logo{font-size:22px;font-weight:900;font-style:italic;color:#ff6100;letter-spacing:-1px;text-decoration:none}
.header-nav{display:flex;gap:12px;align-items:center}
.header-nav a{color:#fff;font-size:12px;font-weight:600;text-decoration:none;opacity:.8;transition:opacity .2s}
.header-nav a:hover{opacity:1;color:#ff6100}

/* Search Section */
.search-section{background:#fff;border-bottom:1px solid #eee;padding:24px 20px}
.search-inner{max-width:600px;margin:0 auto}
.search-title{font-size:22px;font-weight:900;margin-bottom:4px}
.search-sub{font-size:13px;color:#888;margin-bottom:20px}
.search-tabs{display:flex;gap:8px;margin-bottom:20px}
.tab-btn{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;font-family:inherit;transition:all .15s;color:#555}
.tab-btn.active{background:#ff6100;color:#fff;border-color:#ff6100}
.search-form{display:flex;flex-direction:column;gap:10px}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888}
.track-input{width:100%;padding:12px 16px;border:1.5px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;background:#f9f9f9}
.track-input:focus{border-color:#ff6100;background:#fff}
.track-btn{padding:14px;background:#ff6100;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:4px}
.track-btn:hover{background:#e05500}
.track-btn:disabled{background:#ccc;cursor:not-allowed}

/* Results */
.results-section{max-width:600px;margin:24px auto;padding:0 20px 40px}
.order-card{background:#fff;border-radius:14px;border:1.5px solid #eee;overflow:hidden;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.order-header{background:#111;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.order-id{color:#fff;font-size:12px;font-weight:800;letter-spacing:.05em}
.order-date{color:#888;font-size:11px}
.status-badge{padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.status-processing{background:#fff3cd;color:#b45309}
.status-shipped{background:#dbeafe;color:#1d4ed8}
.status-delivered{background:#dcfce7;color:#16a34a}
.status-cancelled{background:#fee2e2;color:#dc2626}

/* Timeline */
.timeline{padding:20px;border-bottom:1px solid #f0f0f0}
.timeline-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#888;margin-bottom:16px}
.timeline-steps{display:flex;justify-content:space-between;position:relative}
.timeline-steps::before{content:'';position:absolute;top:14px;left:0;right:0;height:2px;background:#e0e0e0;z-index:0}
.timeline-progress{content:'';position:absolute;top:14px;left:0;height:2px;background:#ff6100;z-index:1;transition:width .3s}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;position:relative;z-index:2}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .2s}
.step-dot.done{background:#ff6100;border-color:#ff6100;color:#fff}
.step-dot.active{background:#fff;border-color:#ff6100;color:#ff6100}
.step-label{font-size:9px;font-weight:700;text-align:center;color:#aaa;text-transform:uppercase;letter-spacing:.05em}
.step-label.done,.step-label.active{color:#ff6100}

/* Section blocks */
.info-block{padding:16px 20px;border-bottom:1px solid #f0f0f0}
.block-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#ff6100;margin-bottom:12px}
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f8f8f8}
.info-row:last-child{border-bottom:none}
.info-label{font-size:11px;color:#888;font-weight:600}
.info-value{font-size:12px;font-weight:700;text-align:right;max-width:60%}

/* Products */
.products-block{padding:16px 20px;border-bottom:1px solid #f0f0f0}
.product-row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f8f8f8}
.product-row:last-child{border-bottom:none}
.product-img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#f5f5f5;flex-shrink:0}
.product-info{flex:1;min-width:0}
.product-name{font-size:12px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:4px}
.product-meta{font-size:10px;color:#888}
.product-price{font-size:14px;font-weight:900;color:#ff6100;flex-shrink:0}

/* Tracking */
.tracking-block{padding:16px 20px}
.tracking-number{background:#f5f5f5;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tracking-num-text{font-size:13px;font-weight:800;letter-spacing:.05em}
.copy-btn{background:#ff6100;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.carrier-btn{width:100%;padding:12px;background:#111;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s}
.carrier-btn:hover{background:#ff6100}

/* Empty / Error */
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:64px;margin-bottom:16px}
.empty-title{font-size:18px;font-weight:800;margin-bottom:8px}
.empty-sub{font-size:13px;color:#888;line-height:1.6}

/* Loading */
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #f0f0f0;border-top-color:#ff6100;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap{text-align:center;padding:60px 20px}

/* Account prompt */
.account-prompt{background:#fff8f0;border:1.5px solid #ff6100;border-radius:10px;padding:16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
.prompt-icon{font-size:24px;flex-shrink:0}
.prompt-text{flex:1}
.prompt-title{font-size:13px;font-weight:800;margin-bottom:4px}
.prompt-sub{font-size:11px;color:#888;margin-bottom:10px}
.prompt-btns{display:flex;gap:8px;flex-wrap:wrap}
.prompt-btn{padding:7px 14px;border-radius:6px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.prompt-btn.primary{background:#ff6100;color:#fff}
.prompt-btn.secondary{background:#f5f5f5;color:#333;border:1.5px solid #e0e0e0}

@media(max-width:480px){
.search-section{padding:20px 16px}
.results-section{padding:0 16px 40px}
.order-header{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">Mova99</a>
  <div class="header-nav">
    <a href="/dashboard">Shop</a>
    <a href="/login">Login</a>
    <a href="/signup">Sign Up</a>
  </div>
</div>

<div class="search-section">
  <div class="search-inner">
    <h1 class="search-title">Track Your Order</h1>
    <p class="search-sub">Enter your order details below to check your order status</p>

    <div class="search-tabs">
      <button class="tab-btn active" id="tab-guest" onclick="switchTab('guest')">Order ID + Email</button>
      <button class="tab-btn" id="tab-account" onclick="switchTab('account')">My Account Orders</button>
    </div>

    <div id="form-guest" class="search-form">
      <div class="input-group">
        <label class="input-label">Order ID</label>
        <input type="text" class="track-input" id="input-order-id" placeholder="e.g. ORD-ABC123" autocomplete="off">
      </div>
      <div class="input-group">
        <label class="input-label">Email Address</label>
        <input type="email" class="track-input" id="input-email" placeholder="email used at checkout" autocomplete="email">
      </div>
      <button class="track-btn" id="track-btn" onclick="trackOrder()">Track Order →</button>
    </div>

    <div id="form-account" class="search-form" style="display:none">
      <p style="font-size:13px;color:#888;padding:12px;background:#f9f9f9;border-radius:8px">Login to your account to view all your orders automatically.</p>
      <a href="/login" class="track-btn" style="text-align:center;text-decoration:none;display:block">Login to My Account →</a>
    </div>
  </div>
</div>

<div class="results-section" id="results-section"></div>

<script>
function switchTab(tab) {
  document.getElementById('tab-guest').classList.toggle('active', tab==='guest');
  document.getElementById('tab-account').classList.toggle('active', tab==='account');
  document.getElementById('form-guest').style.display = tab==='guest' ? 'flex' : 'none';
  document.getElementById('form-account').style.display = tab==='account' ? 'flex' : 'none';
}

function getStatusClass(status) {
  const s = (status||'').toLowerCase();
  if (s.includes('deliver')) return 'status-delivered';
  if (s.includes('ship') || s.includes('transit')) return 'status-shipped';
  if (s.includes('cancel')) return 'status-cancelled';
  return 'status-processing';
}

function getStepIndex(status) {
  const s = (status||'').toLowerCase();
  if (s.includes('deliver')) return 3;
  if (s.includes('ship') || s.includes('transit')) return 2;
  if (s.includes('process') || s.includes('confirm')) return 1;
  return 0;
}

function renderOrder(order, isGuest) {
  const sec = document.getElementById('results-section');
  const stepIdx = getStepIndex(order.status);
  const steps = ['Placed','Processing','Shipped','Delivered'];
  const stepIcons = ['📋','⚙️','📦','✅'];
  const progressPct = [0, 33, 66, 100][stepIdx];

  const cart = order.cart || [];

  let productsHtml = cart.map(item => `
    <div class="product-row">
      <img class="product-img" src="${item.image||''}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2252%22 height=%2252%22><rect width=%2252%22 height=%2252%22 fill=%22%23f5f5f5%22/></svg>'">
      <div class="product-info">
        <div class="product-name">${item.name||'Product'}</div>
        <div class="product-meta">Qty: ${item.qty||1}${item.color?' · '+item.color:''}${item.size?' · '+item.size:''}</div>
      </div>
      <div class="product-price">$${parseFloat(item.price||0).toFixed(2)}</div>
    </div>
  `).join('');

  const shipping = order.shippingAddress || {};
  const payment = order.payment || {};

  let trackingHtml = '';
  if (order.trackingNumber) {
    trackingHtml = `
      <div class="tracking-block">
        <div class="block-title">Tracking</div>
        <div class="tracking-number">
          <span class="tracking-num-text">${order.trackingNumber}</span>
          <button class="copy-btn" onclick="copyTracking('${order.trackingNumber}')">Copy</button>
        </div>
        ${order.trackingUrl ? `<button class="carrier-btn" onclick="window.open('${order.trackingUrl}','_blank')">Track on Carrier Website →</button>` : ''}
      </div>
    `;
  }

  let accountPromptHtml = '';
  if (isGuest) {
    accountPromptHtml = `
      <div class="account-prompt">
        <div class="prompt-icon">💡</div>
        <div class="prompt-text">
          <div class="prompt-title">Create an account to track orders easily</div>
          <div class="prompt-sub">Save your order history, get faster checkout and earn referral rewards.</div>
          <div class="prompt-btns">
            <a href="/signup" class="prompt-btn primary">Create Account</a>
            <a href="/login" class="prompt-btn secondary">Login</a>
          </div>
        </div>
      </div>
    `;
  }

  sec.innerHTML = `
    ${accountPromptHtml}
    <div class="order-card">
      <div class="order-header">
        <div>
          <div class="order-id">Order ${order.orderId || order._id}</div>
          <div class="order-date">${order.createdAt ? new Date(order.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : ''}</div>
        </div>
        <span class="status-badge ${getStatusClass(order.status)}">${order.status||'Processing'}</span>
      </div>

      <div class="timeline">
        <div class="timeline-title">Order Progress</div>
        <div style="position:relative">
          <div class="timeline-steps">
            <div class="timeline-progress" style="width:${progressPct}%"></div>
            ${steps.map((s,i) => `
              <div class="step">
                <div class="step-dot ${i<=stepIdx?'done':''} ${i===stepIdx?'active':''}">${stepIcons[i]}</div>
                <div class="step-label ${i<=stepIdx?'done':''}">${s}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="info-block">
        <div class="block-title">Order Summary</div>
        <div class="info-row"><span class="info-label">Order ID</span><span class="info-value">${order.orderId||order._id||'—'}</span></div>
        <div class="info-row"><span class="info-label">Date</span><span class="info-value">${order.createdAt ? new Date(order.createdAt).toLocaleDateString() : '—'}</span></div>
        <div class="info-row"><span class="info-label">Status</span><span class="info-value">${order.status||'Processing'}</span></div>
        <div class="info-row"><span class="info-label">Est. Delivery</span><span class="info-value">3-8 Business Days</span></div>
        <div class="info-row"><span class="info-label">Subtotal</span><span class="info-value">$${parseFloat(order.subtotal||0).toFixed(2)}</span></div>
        <div class="info-row"><span class="info-label">Shipping</span><span class="info-value">$${parseFloat(order.shippingAmount||2.41).toFixed(2)}</span></div>
        <div class="info-row" style="border-top:2px solid #ff6100;margin-top:4px;padding-top:8px"><span class="info-label" style="font-weight:800;color:#1a1a1a">Total Paid</span><span class="info-value" style="color:#ff6100;font-size:15px">$${parseFloat(order.total||0).toFixed(2)}</span></div>
      </div>

      <div class="products-block">
        <div class="block-title">Items Ordered (${cart.length})</div>
        ${productsHtml || '<p style="color:#888;font-size:12px">No items found</p>'}
      </div>

      <div class="info-block">
        <div class="block-title">Shipping Details</div>
        <div class="info-row"><span class="info-label">Name</span><span class="info-value">${shipping.name||order.customerName||'—'}</span></div>
        <div class="info-row"><span class="info-label">Address</span><span class="info-value">${shipping.line1||'—'}</span></div>
        ${shipping.line2 ? `<div class="info-row"><span class="info-label">Address 2</span><span class="info-value">${shipping.line2}</span></div>` : ''}
        <div class="info-row"><span class="info-label">City</span><span class="info-value">${shipping.city||'—'}</span></div>
        <div class="info-row"><span class="info-label">State</span><span class="info-value">${shipping.state||'—'}</span></div>
        <div class="info-row"><span class="info-label">ZIP</span><span class="info-value">${shipping.postal_code||'—'}</span></div>
        <div class="info-row"><span class="info-label">Country</span><span class="info-value">${shipping.country||'US'}</span></div>
      </div>

      <div class="info-block">
        <div class="block-title">Payment</div>
        <div class="info-row"><span class="info-label">Method</span><span class="info-value">${payment.brand ? payment.brand.toUpperCase() + ' ending in ' + payment.last4 : 'Card'}</span></div>
        <div class="info-row"><span class="info-label">Amount Charged</span><span class="info-value">$${parseFloat(order.total||0).toFixed(2)}</span></div>
        <div class="info-row"><span class="info-label">Payment Status</span><span class="info-value" style="color:#16a34a">Paid ✓</span></div>
      </div>

      ${trackingHtml}
    </div>
  `;
}

function renderEmpty(msg) {
  document.getElementById('results-section').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <div class="empty-title">Order Not Found</div>
      <div class="empty-sub">${msg||'We could not find an order matching your details.<br>Please check your Order ID and email address.'}</div>
    </div>
  `;
}

function renderLoading() {
  document.getElementById('results-section').innerHTML = `
    <div class="loading-wrap">
      <div class="spinner"></div>
      <p style="margin-top:16px;font-size:13px;color:#888">Looking up your order...</p>
    </div>
  `;
}

async function trackOrder() {
  const orderId = document.getElementById('input-order-id').value.trim();
  const email = document.getElementById('input-email').value.trim();
  if (!orderId || !email) { alert('Please enter both Order ID and email address.'); return; }
  const btn = document.getElementById('track-btn');
  btn.disabled = true; btn.textContent = 'Tracking...';
  renderLoading();
  try {
    const r = await fetch('/api/track-order?orderId=' + encodeURIComponent(orderId) + '&email=' + encodeURIComponent(email));
    const d = await r.json();
    if (d.error) renderEmpty(d.error);
    else renderOrder(d, true);
  } catch(e) {
    renderEmpty('Something went wrong. Please try again.');
  }
  btn.disabled = false; btn.textContent = 'Track Order →';
}

function copyTracking(num) {
  navigator.clipboard.writeText(num).then(() => {
    const btn = event.target;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

document.getElementById('input-email').addEventListener('keydown', e => { if(e.key==='Enter') trackOrder(); });
document.getElementById('input-order-id').addEventListener('keydown', e => { if(e.key==='Enter') trackOrder(); });

// Auto-load if logged in
const session = JSON.parse(localStorage.getItem('foundry_session')||'null');
if (session) {
  const nav = document.querySelector('.header-nav');
  nav.innerHTML = `<a href="/dashboard">Shop</a><a href="/dashboard#orders">My Orders</a>`;
}

// Check URL params for direct tracking
const urlParams = new URLSearchParams(window.location.search);
const urlOrderId = urlParams.get('order_id') || urlParams.get('orderId');
const urlEmail = urlParams.get('email');
if (urlOrderId && urlEmail) {
  document.getElementById('input-order-id').value = urlOrderId;
  document.getElementById('input-email').value = urlEmail;
  trackOrder();
}
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}</script>
</body>
</html>
