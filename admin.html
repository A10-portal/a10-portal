<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mova99 Admin</title>
<link rel="icon" type="image/png" href="/image/logo.png">
<style>
body { opacity: 0; transition: opacity .15s; }
body.ready { opacity: 1; }
</style>
<script>
// Show page immediately — password is the security layer.
// IP restriction is enforced server-side in admin-api on every authenticated request.
document.addEventListener('DOMContentLoaded', () => document.body.classList.add('ready'));
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #ff6100;
  --orange-pale: #fff3ed;
  --bg: #f4f4f5;
  --white: #ffffff;
  --border: #e4e4e7;
  --text: #18181b;
  --muted: #71717a;
  --green: #16a34a;
  --red: #dc2626;
  --sidebar-w: 220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: var(--orange); border-radius: 2px; }

/* ── LOGIN ── */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
.login-box { background: #111; border: 1px solid #222; border-radius: 14px; padding: 36px; width: 100%; max-width: 360px; }
.login-logo { font-size: 28px; font-weight: 900; font-style: italic; color: var(--white); letter-spacing: -1px; margin-bottom: 4px; }
.login-logo span { color: var(--orange); }
.login-sub { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: #555; margin-bottom: 28px; }
.login-input { width: 100%; padding: 12px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; font-family: inherit; outline: none; margin-bottom: 12px; }
.login-input:focus { border-color: var(--orange); }
.login-btn { width: 100%; padding: 13px; background: var(--orange); color: white; border: none; border-radius: 8px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; font-family: inherit; transition: background .15s; }
.login-btn:hover { background: #e55500; }
.login-err { font-size: 11px; color: #ef4444; text-align: center; margin-top: 10px; display: none; }

/* ── LAYOUT ── */
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: #0a0a0a; display: flex; flex-direction: column; z-index: 100; border-right: 1px solid #1a1a1a; }
.sidebar-logo { font-size: 20px; font-weight: 900; font-style: italic; color: white; padding: 22px 20px 16px; letter-spacing: -1px; }
.sidebar-logo span { color: var(--orange); }
.sidebar-divider { height: 1px; background: #1a1a1a; margin: 6px 0; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 16px; margin: 2px 8px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #888; cursor: pointer; transition: all .15s; }
.nav-item:hover { background: #1a1a1a; color: #ccc; }
.nav-item.active { background: var(--orange); color: white; font-weight: 700; }
.nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
.main { margin-left: var(--sidebar-w); min-height: 100vh; }
.topbar { background: white; border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-size: 15px; font-weight: 800; }
.logout-btn { padding: 7px 16px; background: #0a0a0a; color: white; border: none; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; font-family: inherit; }
.content { padding: 24px; max-width: 1200px; }

/* ── CARDS / STATS ── */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
@media(min-width:768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
.stat-card { background: white; border-radius: 10px; border: 1px solid var(--border); padding: 18px; }
.stat-num { font-size: 28px; font-weight: 900; color: var(--text); }
.stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 4px; }
.stat-card.orange { background: var(--orange); border-color: var(--orange); }
.stat-card.orange .stat-num, .stat-card.orange .stat-label { color: white; }
.card { background: white; border-radius: 10px; border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }
.card-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 14px; }

/* ── TABLES ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; padding: 8px 12px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 2px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }

/* ── BADGES ── */
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
.badge-yellow { background: #fef9c3; color: #854d0e; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-green { background: #dcfce7; color: #15803d; }
.badge-red { background: #fee2e2; color: #b91c1c; }
.badge-gray { background: #f4f4f5; color: #52525b; }
.badge-orange { background: var(--orange-pale); color: var(--orange); }

/* ── TABS ── */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tab-btn { padding: 7px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--border); background: white; color: var(--muted); font-family: inherit; transition: all .15s; }
.tab-btn.active, .tab-btn:hover { background: var(--orange); color: white; border-color: var(--orange); }

/* ── FORMS ── */
.field-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 5px; }
.field-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; transition: border-color .15s; background: white; }
.field-input:focus { border-color: var(--orange); }
.btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all .15s; }
.btn-primary { background: var(--orange); color: white; }
.btn-primary:hover { background: #e55500; }
.btn-dark { background: #0a0a0a; color: white; }
.btn-dark:hover { background: #222; }
.btn-green { background: #16a34a; color: white; }
.btn-green:hover { background: #15803d; }
.btn-red { background: #dc2626; color: white; }
.btn-red:hover { background: #b91c1c; }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--orange); color: var(--orange); }
.w-full { width: 100%; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.flex { display: flex; } .items-center { align-items: center; } .justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .flex-1 { flex: 1; }
.text-sm { font-size: 12px; } .text-xs { font-size: 10px; } .text-muted { color: var(--muted); }
.font-bold { font-weight: 700; } .font-mono { font-family: monospace; }
.text-orange { color: var(--orange); } .text-green { color: var(--green); } .text-red { color: var(--red); }
.space-y > * + * { margin-top: 10px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.spinner { width: 24px; height: 24px; border: 3px solid var(--orange-pale); border-top-color: var(--orange); border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg-box { padding: 10px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; display: none; }
.msg-success { background: #f0fdf4; color: var(--green); }
.msg-error { background: #fef2f2; color: var(--red); }

/* ── ORDER CARD ── */
.order-card { background: white; border-radius: 10px; border: 1.5px solid var(--border); overflow: hidden; margin-bottom: 12px; }
.order-card-head { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: flex-start; background: #fafafa; }

/* ── USER CARD ── */
.user-card { background: white; border-radius: 10px; border: 1.5px solid var(--border); overflow: hidden; margin-bottom: 10px; }
.user-card.pinned { border-color: #f59e0b; }
.user-head { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
.user-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
.user-body.open { display: block; }

/* ── MOBILE ── */
@media(max-width:768px) {
  .sidebar { transform: translateX(-100%); transition: transform .3s; }
  .sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,.3); }
  .main { margin-left: 0; }
  .content { padding: 14px; }
  .mob-topbar { display: flex !important; }
  .desk-topbar { display: none !important; }
  .grid-3 { grid-template-columns: 1fr; }
}
.mob-topbar { display: none; align-items: center; justify-content: space-between; padding: 12px 16px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 110; }
.mob-logo { font-size: 18px; font-weight: 900; font-style: italic; color: white; }
.mob-logo span { color: var(--orange); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-logo">Mova<span>99</span></div>
    <div class="login-sub">Admin Panel</div>
    <input class="login-input" id="pass" type="password" placeholder="Admin Password" onkeypress="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">Access Panel</button>
    <div class="login-err" id="login-err">Incorrect password</div>
  </div>
</div>

<!-- PANEL -->
<div id="panel" style="display:none">

  <!-- Mobile topbar -->
  <div class="mob-topbar">
    <div class="mob-logo">Mova<span>99</span></div>
    <button onclick="document.getElementById('sidebar').classList.toggle('open')" style="background:none;border:none;color:white;font-size:22px;cursor:pointer">☰</button>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Mova<span>99</span></div>
    <div class="sidebar-divider"></div>
    <div class="nav-item active" id="nav-home" onclick="showTab('home')"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-item" id="nav-orders" onclick="showTab('orders')"><span class="nav-icon">📦</span> Orders</div>
    <div class="nav-item" id="nav-users" onclick="showTab('users')"><span class="nav-icon">👥</span> Users</div>
    <div class="nav-item" id="nav-fulfill" onclick="showTab('fulfill')"><span class="nav-icon">🚚</span> Fulfill</div>
    <div class="nav-item" id="nav-push" onclick="showTab('push')"><span class="nav-icon">🔔</span> Push Notify</div>
    <div style="flex:1"></div>
    <div class="sidebar-divider"></div>
    <div class="nav-item" onclick="logout()" style="color:#ef4444;margin-bottom:12px"><span class="nav-icon">🚪</span> Logout</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar desk-topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="content fade-in" id="content"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
let token = sessionStorage.getItem('adminToken') || '';
if (token) { showPanel(); }

async function login() {
  const pass = document.getElementById('pass').value;
  const err  = document.getElementById('login-err');
  err.style.display = 'none';
  try {
    const r = await fetch('/api/admin-api?action=auth', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass, adminType: 'product' })
    });
    const d = await r.json();
    if (d.token) { token = d.token; sessionStorage.setItem('adminToken', token); showPanel(); }
    else err.style.display = 'block';
  } catch(e) { err.style.display = 'block'; }
}

function logout() { sessionStorage.clear(); window.location.reload(); }

function showPanel() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  showTab('home');
}

// Authenticated fetch helper
function af(url, opts = {}) {
  opts.headers = { ...(opts.headers||{}), 'x-admin-token': token, 'Content-Type': 'application/json' };
  return fetch(url, opts);
}

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
const TAB_TITLES = { home:'Dashboard', orders:'Orders', users:'Users', fulfill:'Fulfill Order', push:'Push Notifications' };

function showTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + tab);
  if (nav) nav.classList.add('active');
  const title = document.getElementById('topbar-title');
  if (title) title.textContent = TAB_TITLES[tab] || tab;
  document.getElementById('sidebar').classList.remove('open');
  const content = document.getElementById('content');
  content.innerHTML = '<div class="spinner"></div>';
  content.className = 'content fade-in';

  if (tab === 'home')    loadHome();
  if (tab === 'orders')  loadOrders();
  if (tab === 'users')   loadUsers();
  if (tab === 'fulfill') renderFulfill();
  if (tab === 'push')    renderPush();
}

// ══════════════════════════════════════════
// HOME / STATS
// ══════════════════════════════════════════
async function loadHome(dateFrom, dateTo) {
  const content = document.getElementById('content');
  try {
    let url = '/api/admin-api?action=stats';
    if (dateFrom) url += '&dateFrom=' + dateFrom;
    if (dateTo)   url += '&dateTo='   + dateTo;
    const r = await af(url);
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    const custom = (dateFrom || dateTo) ? `
      <div class="card mt-3">
        <div class="card-title">Custom Range Results</div>
        <div class="space-y">
          <div class="flex justify-between"><span class="text-sm text-muted">Orders</span><span class="font-bold">${d.customOrders||0}</span></div>
          <div class="flex justify-between"><span class="text-sm text-muted">Revenue</span><span class="font-bold">$${((d.customRevenue||0)/100).toFixed(2)}</span></div>
          <div class="flex justify-between"><span class="text-sm text-muted">New Users</span><span class="font-bold">${d.customUsers||0}</span></div>
        </div>
      </div>` : '';

    content.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num">${d.totalUsers||0}</div><div class="stat-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-num">${d.totalOrders||0}</div><div class="stat-label">Total Orders</div></div>
        <div class="stat-card" style="background:#fef9c3;border-color:#f59e0b"><div class="stat-num" style="color:#92400e">${d.pendingOrders||0}</div><div class="stat-label" style="color:#92400e">Pending</div></div>
        <div class="stat-card orange"><div class="stat-num">$${((d.totalRevenue||0)/100).toFixed(0)}</div><div class="stat-label">Total Revenue</div></div>
      </div>

      <div class="grid-2 mb-4">
        <div class="card">
          <div class="card-title">Today</div>
          <div class="space-y">
            <div class="flex justify-between"><span class="text-sm text-muted">Orders</span><span class="font-bold">${d.ordersToday||0}</span></div>
            <div class="flex justify-between"><span class="text-sm text-muted">Revenue</span><span class="font-bold text-orange">$${((d.revenueToday||0)/100).toFixed(2)}</span></div>
            <div class="flex justify-between"><span class="text-sm text-muted">New Users</span><span class="font-bold">${d.newUsersToday||0}</span></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">This Week</div>
          <div class="space-y">
            <div class="flex justify-between"><span class="text-sm text-muted">Orders</span><span class="font-bold">${d.ordersWeek||0}</span></div>
            <div class="flex justify-between"><span class="text-sm text-muted">Revenue</span><span class="font-bold text-orange">$${((d.revenueWeek||0)/100).toFixed(2)}</span></div>
            <div class="flex justify-between"><span class="text-sm text-muted">New Users</span><span class="font-bold">${d.newUsersWeek||0}</span></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Filter by Date Range</div>
        <div class="flex gap-2 items-center" style="flex-wrap:wrap">
          <div>
            <label class="field-label">From</label>
            <input type="date" id="df" value="${dateFrom||''}" class="field-input" style="width:auto">
          </div>
          <div>
            <label class="field-label">To</label>
            <input type="date" id="dt" value="${dateTo||''}" class="field-input" style="width:auto">
          </div>
          <div style="margin-top:14px">
            <button onclick="loadHome(document.getElementById('df').value,document.getElementById('dt').value)" class="btn btn-dark" style="margin-right:6px">Apply</button>
            <button onclick="loadHome()" class="btn btn-outline">Clear</button>
          </div>
        </div>
        ${custom}
      </div>`;
  } catch(e) {
    content.innerHTML = `<div class="card"><p class="text-red text-sm">Failed to load stats: ${e.message}</p></div>`;
  }
}

// ══════════════════════════════════════════
// ORDERS
// ══════════════════════════════════════════
let ordersCache = [];
let orderTab = 'pending';

async function loadOrders() {
  try {
    const r = await af('/api/admin-api?action=orders');
    ordersCache = await r.json();
    renderOrders();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="card"><p class="text-red text-sm">Failed: ${e.message}</p></div>`;
  }
}

function renderOrders() {
  const content = document.getElementById('content');
  const all        = ordersCache;
  const pending    = all.filter(o => !o.cjOrderId && !['shipped','delivered','declined','cancelled'].includes(o.status));
  const processing = all.filter(o => o.cjOrderId || o.status === 'shipped');
  const delivered  = all.filter(o => o.status === 'delivered');
  const declined   = all.filter(o => ['declined','cancelled'].includes(o.status));
  const map = { pending, processing, delivered, declined, all };
  const filtered = map[orderTab] || all;

  const tabBtn = (id, label, count) =>
    `<button class="tab-btn${orderTab===id?' active':''}" onclick="orderTab='${id}';renderOrders()">${label} (${count})</button>`;

  const statusBadge = s => {
    const map2 = {
      payment_received: 'badge-yellow', processing: 'badge-blue',
      shipped: 'badge-green', delivered: 'badge-green',
      declined: 'badge-red', cancelled: 'badge-red',
      payment_failed: 'badge-red', expired: 'badge-gray'
    };
    const cls = map2[s] || 'badge-gray';
    return `<span class="badge ${cls}">${(s||'').replace(/_/g,' ')}</span>`;
  };

  let h = `
    <div class="flex justify-between items-center mb-3">
      <span style="font-size:15px;font-weight:800">Orders (${all.length})</span>
      <button onclick="loadOrders()" class="btn btn-outline" style="padding:6px 14px;font-size:11px">↻ Refresh</button>
    </div>
    <div class="tabs">
      ${tabBtn('pending','Pending',pending.length)}
      ${tabBtn('processing','Processing',processing.length)}
      ${tabBtn('delivered','Delivered',delivered.length)}
      ${tabBtn('declined','Declined/Cancelled',declined.length)}
      ${tabBtn('all','All',all.length)}
    </div>`;

  if (!filtered.length) {
    h += `<div class="card" style="text-align:center;padding:48px"><p class="text-muted text-sm">No orders here</p></div>`;
    content.innerHTML = h; return;
  }

  filtered.forEach(o => {
    const d = new Date(o.createdAt);
    const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
    const total = ((o.amountTotal||0)/100).toFixed(2);
    const addr = o.shippingAddress
      ? `${o.shippingAddress.line1||''}, ${o.shippingAddress.city||''}, ${o.shippingAddress.state||''} ${o.shippingAddress.postal_code||''}`
      : '—';

    const itemsHtml = (o.items||[]).map(item => {
      const sku = item.variantSku || item.productSku || item.sku || '—';
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
        ${item.image ? `<img src="${item.image}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#f4f4f5">` : `<div style="width:44px;height:44px;background:#f4f4f5;border-radius:6px;flex-shrink:0"></div>`}
        <div style="flex:1;min-width:0">
          <p style="font-size:11px;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${item.name||item.pid||'Product'}</p>
          ${item.variant||item.color||item.size ? `<p style="font-size:10px;color:var(--orange);font-weight:600">${[item.color,item.size].filter(Boolean).join(' / ')||item.variant||''}</p>` : ''}
          <p style="font-size:10px;color:var(--muted)">Qty: ${item.qty||1} · $${parseFloat(item.price||0).toFixed(2)}</p>

let usersCache = [];
let pinnedUsers = JSON.parse(sessionStorage.getItem('pinnedUsers')||'[]');
let userSearch = '';

async function loadUsers() {
  try {
    const r = await af('/api/admin-api?action=users');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    usersCache = Array.isArray(d) ? d : [];
    renderUsers();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="card"><p class="text-red text-sm">Failed: ${e.message}</p></div>`;
  }
}

function renderUsers() {
  const content = document.getElementById('content');
  let users = [...usersCache].sort((a,b) =>
    (pinnedUsers.includes(a.uniqueID)?0:1) - (pinnedUsers.includes(b.uniqueID)?0:1)
  );
  if (userSearch) {
    const q = userSearch.toLowerCase();
    users = users.filter(u => (u.uniqueID+u.email+u.phone+u.fullName).toLowerCase().includes(q));

  let h = `
    <div class="flex justify-between items-center mb-3">

      <div class="user-head" onclick="toggleUserExpand('ub-${uid}')">

          <div style="font-size:13px;font-weight:800">${isPinned?'📌 ':''} ${u.fullName||'No Name'}</div>

        </div>

          <div style="font-size:10px;font-weight:700;color:var(--orange)">$${refBal} bal</div>
          <div style="font-size:10px;color:var(--muted)">${u.totalOrders||0} orders</div>
          ${u.referralCode ? `<div style="font-size:10px;color:#7c3aed;font-weight:700">${u.referralCode}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0;margin-left:8px">
          <button onclick="event.stopPropagation();pinUser('${uid}')" style="padding:5px 8px;background:${isPinned?'#f59e0b':'#f4f4f5'};color:${isPinned?'white':'#666'};border:none;border-radius:6px;font-size:10px;cursor:pointer">📌</button>
          <button onclick="event.stopPropagation();adminOpenDash('${uid}')" style="padding:5px 8px;background:#3b82f6;color:white;border:none;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer">Open</button>
        </div>
      </div>
      <div class="user-body" id="ub-${uid}">
        <!-- Info grid -->
        <div class="grid-3 mt-3 mb-3" style="font-size:11px">
          <div><span class="text-muted">Phone</span><div class="font-bold">${u.phone||'—'}</div></div>
          <div><span class="text-muted">Joined</span><div class="font-bold">${u.createdAt?new Date(u.createdAt).toLocaleDateString():'—'}</div></div>
          <div><span class="text-muted">Referred By</span><div class="font-bold">${u.referredBy||'Direct'}</div></div>
          <div><span class="text-muted">Orders Total</span><div class="font-bold">${u.totalOrders||0}</div></div>
          <div><span class="text-muted">Orders Today</span><div class="font-bold">${u.ordersToday||0} · $${((u.revenueToday||0)/100).toFixed(2)}</div></div>

          <div><span class="text-muted">Users Referred</span><div class="font-bold">${u.referredUsers||0}</div></div>
          <div><span class="text-muted">Ref Revenue (week)</span><div class="font-bold">$${((u.referralRevenueWeek||0)/100).toFixed(2)}</div></div>

            <input type="date" id="rdf-${uid}" class="field-input" style="width:auto;padding:7px 10px;font-size:11px">

            <button onclick="saveField('${uid}','referralBalance')" class="btn btn-primary" style="white-space:nowrap">Update</button>

        </div>

        <div class="card mt-2 mb-3" style="padding:14px">
          <div class="flex justify-between items-center mb-3">
            <div class="card-title" style="margin-bottom:0">Transactions</div>

              <button onclick="openTxForm('${uid}','credit')" class="btn btn-green" style="padding:6px 12px;font-size:10px">+ Credit</button>

            ${editField(uid, 'email', 'Email', u.email||'')}

function toggleUserExpand(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const open = el.classList.toggle('open');
  if (open) {
    const uid = id.replace('ub-','');
    loadTxHistory(uid);
  }
}

function editField(uid, field, label, value, type='text', btnCls='btn-dark') {
  const safe = value.replace(/"/g, '&quot;');
  return `<div class="flex gap-2">
    <div style="flex:1">
      <label class="field-label">${label}</label>
      <input id="edit-${field}-${uid}" type="${type}" value="${safe}" placeholder="${label}" class="field-input">
    </div>
    <div style="display:flex;align-items:flex-end">
      <button onclick="saveField('${uid}','${field}')" class="btn ${btnCls}" style="padding:10px 14px;white-space:nowrap">Save</button>
    </div>
  </div>`;
}

function pinUser(uid) {
  const idx = pinnedUsers.indexOf(uid);
  if (idx > -1) pinnedUsers.splice(idx,1);
  else pinnedUsers.push(uid);
  sessionStorage.setItem('pinnedUsers', JSON.stringify(pinnedUsers));
  renderUsers();
}

function adminOpenDash(userId) {
  const data = { token: 'admin-view-' + token, id: userId, expiry: Date.now() + 3600000, isAdminView: true };
  localStorage.setItem('foundry_session', JSON.stringify(data));
  window.open('/dashboard', '_blank');
}

async function loadRefStats(uid) {
  const from = document.getElementById('rdf-'+uid)?.value || '';
  const to   = document.getElementById('rdt-'+uid)?.value || '';
  const el   = document.getElementById('ref-stats-'+uid);
  const u    = usersCache.find(x => x.uniqueID === uid);
  const rc   = u?.referralCode || '';
  if (!rc) { el.innerHTML = '<p class="text-sm text-muted">No referral code.</p>'; return; }
  el.innerHTML = '<p class="text-xs text-muted" style="animation:pulse 1s infinite">Loading...</p>';
  try {
    const r = await af('/api/admin-api?action=referral-stats&refCode='+encodeURIComponent(rc)+(from?'&dateFrom='+from:'')+(to?'&dateTo='+to:''));
    const d = await r.json();
    el.innerHTML = `
      <div class="flex justify-between text-sm"><span class="text-muted">Ref Code</span><span class="font-bold" style="color:#7c3aed">${rc}</span></div>
      <div class="flex justify-between text-sm mt-1"><span class="text-muted">Users Referred</span><span class="font-bold">${d.referredUsers||0}</span></div>
      <div class="flex justify-between text-sm mt-1"><span class="text-muted">Orders by Referrals</span><span class="font-bold">${d.referralOrders||0}</span></div>
      <div class="flex justify-between text-sm mt-1"><span class="text-muted">Revenue from Referrals</span><span class="font-bold text-green">$${((d.referralRevenue||0)/100).toFixed(2)}</span></div>`;
  } catch(e) { el.innerHTML = '<p class="text-sm text-red">Failed</p>'; }
}

async function saveField(uid, field) {
  const input = document.getElementById('edit-'+field+'-'+uid);
  const msg   = document.getElementById('edit-msg-'+uid);
  if (!input) return;
  const val = input.value.trim();
  if (!val && field !== 'referralBalance') { showMsg(msg, 'Enter a value.', false); return; }
  const body = { userId: uid };
  if (field === 'referralBalance') {
    const n = parseFloat(val);
    if (isNaN(n) || n < 0) { showMsg(msg, 'Enter a valid amount.', false); return; }
    body.referralBalance = n;
  } else {
    body[field] = val;
  }
  try {
    const r = await af('/api/admin-api?action=update-user', { method:'POST', body: JSON.stringify(body) });
    const d = await r.json();
    showMsg(msg, d.success ? field + ' updated!' : (d.error||'Failed'), d.success);
    if (d.success) input.value = '';
  } catch(e) { showMsg(msg, 'Network error', false); }
}

function showMsg(el, text, ok) {
  if (!el) return;
  el.textContent = text;
  el.className = 'msg-box ' + (ok ? 'msg-success' : 'msg-error');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ── TRANSACTIONS ──────────────────────────────────────
function openTxForm(uid, type) {
  const el = document.getElementById('tx-form-'+uid);
  if (!el) return;
  const isCredit = type === 'credit';
  el.style.display = 'block';
  el.innerHTML = `
    <p style="font-size:11px;font-weight:800;color:${isCredit?'var(--green)':'var(--red)'};margin-bottom:10px">${isCredit?'+ Add Credit':'− Add Debit'}</p>
    <div class="space-y">
      <div><label class="field-label">Amount ($)</label><input id="tx-amt-${uid}" type="number" placeholder="0.00" min="0.01" step="0.01" class="field-input"></div>
      <div><label class="field-label">Method</label>
        <select id="tx-mth-${uid}" class="field-input">
          <option>Direct Deposit</option><option>Check</option><option>Bank Transfer</option>
        </select>
      </div>
      <div><label class="field-label">Note (optional)</label><input id="tx-note-${uid}" type="text" placeholder="Referral withdrawal..." class="field-input"></div>
      <div class="msg-box" id="tx-msg-${uid}"></div>
      <div class="flex gap-2">
        <button onclick="submitTx('${uid}','${type}')" class="btn ${isCredit?'btn-green':'btn-red'} flex-1">Confirm ${isCredit?'Credit':'Debit'}</button>
        <button onclick="document.getElementById('tx-form-${uid}').style.display='none'" class="btn btn-outline" style="padding:10px 14px">Cancel</button>
      </div>
    </div>`;
  loadTxHistory(uid);
}

async function submitTx(uid, type) {
  const amount = document.getElementById('tx-amt-'+uid)?.value;
  const method = document.getElementById('tx-mth-'+uid)?.value || 'Direct Deposit';
  const note   = document.getElementById('tx-note-'+uid)?.value || '';
  const msg    = document.getElementById('tx-msg-'+uid);
  if (!amount || parseFloat(amount) <= 0) { showMsg(msg, 'Enter a valid amount.', false); return; }
  try {
    const r = await af('/api/admin-api?action=add-transaction', {
      method:'POST', body: JSON.stringify({ userId:uid, amount:parseFloat(amount), type, paymentMethod:method, note })
    });
    const d = await r.json();
    if (d.success) {
      showMsg(msg, (type==='credit'?'+':'-') + '$' + parseFloat(amount).toFixed(2) + ' applied!', true);
      setTimeout(() => { document.getElementById('tx-form-'+uid).style.display='none'; loadTxHistory(uid); }, 1200);
    } else showMsg(msg, d.error||'Failed', false);
  } catch(e) { showMsg(msg, 'Network error', false); }
}

async function loadTxHistory(uid) {
  const el = document.getElementById('tx-list-'+uid);
  if (!el) return;
  try {
    const r = await af('/api/admin-api?action=get-transactions&userId='+encodeURIComponent(uid));
    const txs = await r.json();
    if (!Array.isArray(txs)||!txs.length) { el.innerHTML='<p class="text-sm text-muted">No transactions yet.</p>'; return; }
    let html = '<div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">';
    txs.slice(0, 20).forEach((tx, i) => {
      const isDebit = tx.type==='debit';
      const amt = parseFloat(tx.amount).toFixed(2);
      const date = new Date(tx.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px${i>0?';border-top:1px solid var(--border)':''}">
        <div>
          <p style="font-size:12px;font-weight:700">${tx.paymentMethod||'Direct Deposit'}</p>
          ${tx.note?`<p style="font-size:10px;color:var(--muted)">${tx.note}</p>`:''}
          <p style="font-size:10px;color:var(--muted)">${date}</p>
        </div>
        <span style="font-size:14px;font-weight:800;color:${isDebit?'var(--red)':'var(--green)'}">${isDebit?'−':'+'}$${amt}</span>
      </div>`;
    });
    html += '</div>';
    el.innerHTML = html;
  } catch(e) { el.innerHTML = '<p class="text-sm text-red">Error loading</p>'; }
}

function renderFulfill() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card" style="max-width:560px">
      <div class="card-title">Fulfill Order</div>
      <div class="space-y">
        <div><label class="field-label">User ID</label><input id="f-uid" class="field-input" placeholder="User uniqueID"></div>
        <div><label class="field-label">Order ID (MongoDB _id)</label><input id="f-oid" class="field-input" placeholder="MongoDB _id"></div>
      </div>

      <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px">
        <p style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--green);margin-bottom:12px">Option 1 — Mark as Shipped</p>
        <div class="space-y">
          <div><label class="field-label">Tracking Number</label><input id="f-tracking" class="field-input" placeholder="e.g. LW123456789CN"></div>
          <div><label class="field-label">Tracking Link (optional)</label><input id="f-link" class="field-input" placeholder="https://..."></div>
          <button onclick="doFulfill('ship')" class="btn btn-green w-full">Mark Shipped & Notify Customer</button>
        </div>
      </div>

      <div style="border-top:1px solid var(--border);margin-top:16px;padding-top:16px">
        <p style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--red);margin-bottom:12px">Option 2 — Decline Order</p>
        <div class="space-y">
          <div><label class="field-label">Reason for Decline</label><textarea id="f-reason" class="field-input" rows="3" placeholder="e.g. Product out of stock — full refund issued." style="resize:vertical"></textarea></div>
          <button onclick="doFulfill('decline')" class="btn btn-red w-full">Decline & Notify Customer</button>
        </div>
      </div>

      <div class="msg-box mt-3" id="f-msg"></div>
    </div>`;
}

async function doFulfill(action) {
  const uid      = document.getElementById('f-uid')?.value.trim();
  const oid      = document.getElementById('f-oid')?.value.trim();
  const tracking = document.getElementById('f-tracking')?.value.trim() || '';
  const link     = document.getElementById('f-link')?.value.trim() || '';
  const reason   = document.getElementById('f-reason')?.value.trim() || '';
  const msg      = document.getElementById('f-msg');
  if (!uid||!oid) { showMsg(msg,'User ID and Order ID required.',false); return; }
  if (action==='ship'&&!tracking) { showMsg(msg,'Tracking number required.',false); return; }
  if (action==='decline'&&!reason) { showMsg(msg,'Decline reason required.',false); return; }
  try {
    const r = await af('/api/admin-api?action=fulfill', {
      method:'POST', body:JSON.stringify({ userId:uid, orderId:oid, action, trackingNumber:tracking, trackingLink:link, declineReason:reason })
    });
    const d = await r.json();
    if (d.success) {
      showMsg(msg, action==='ship' ? '✓ Order shipped! Customer notified.' : '✓ Order declined. Customer notified.', true);
      ['f-uid','f-oid','f-tracking','f-link','f-reason'].forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
    } else showMsg(msg, d.error||'Failed', false);
  } catch(e) { showMsg(msg, 'Network error', false); }
}

function fillFulfill(oid, uid) {
  showTab('fulfill');
  setTimeout(() => {
    const o = document.getElementById('f-oid');
    const u = document.getElementById('f-uid');
    if (o) o.value = oid;
    if (u) u.value = uid;
  }, 80);
}

        <div id="push-stats" style="background:#1a1a1a;border-radius:8px;padding:14px;text-align:center;border:1px solid #333">
          <div style="font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em">Total Subscribers</div>
          <div id="push-count" style="font-size:28px;font-weight:900;color:#ff6100">...</div>
        </div>

        <!-- AUTO SCHEDULE INFO -->
        <div style="background:#1a1a1a;border:1px solid #ff6100;border-radius:8px;padding:14px">
          <div style="font-size:11px;font-weight:800;color:#ff6100;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em">Auto Schedule</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div style="background:#111;border-radius:6px;padding:8px;text-align:center">
              <div style="font-size:16px;margin-bottom:3px">☀️</div>
              <div style="font-size:9px;color:#888">Morning</div>
              <div style="font-size:11px;font-weight:700;color:#ff6100">9:00 AM</div>
            </div>
            <div style="background:#111;border-radius:6px;padding:8px;text-align:center">
              <div style="font-size:16px;margin-bottom:3px">🌤️</div>
              <div style="font-size:9px;color:#888">Afternoon</div>
              <div style="font-size:11px;font-weight:700;color:#ff6100">2:00 PM</div>
            </div>
            <div style="background:#111;border-radius:6px;padding:8px;text-align:center">
              <div style="font-size:16px;margin-bottom:3px">🌙</div>
              <div style="font-size:9px;color:#888">Evening</div>
              <div style="font-size:11px;font-weight:700;color:#ff6100">7:00 PM</div>
            </div>
          </div>
          <div style="font-size:10px;color:#555;margin-top:8px">Messages rotate automatically from 7 different messages per period</div>
        </div>

        <!-- QUICK SEND -->
        <div>
          <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Quick Send</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <button onclick="quickSend('morning')" class="btn btn-primary">☀️ Morning Deal</button>
            <button onclick="quickSend('afternoon')" class="btn btn-primary">🌤️ Afternoon Deal</button>
            <button onclick="quickSend('evening')" class="btn btn-primary">🌙 Evening Deal</button>
            <button onclick="quickSend('referral')" class="btn" style="background:#333;color:#fff;border:none">💰 Referral Promo</button>
          </div>
        </div>

        <!-- CUSTOM MESSAGE -->
        <div style="border-top:1px solid #222;padding-top:14px">
          <div style="font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Custom Message</div>
          <div><label class="field-label">Title</label><input id="push-title" class="field-input" placeholder="e.g. New deals just dropped 🔥"></div>
          <div><label class="field-label">Message</label><textarea id="push-body" class="field-input" rows="3" placeholder="Write your message..." style="resize:vertical"></textarea></div>
          <div><label class="field-label">Product Image URL (optional)</label><input id="push-image" class="field-input" placeholder="https://www.mova99.com/api/get-orders?img=https%3A%2F%2Fcf.cjdropshipping.com%2F..."></div>
          <div style="font-size:10px;color:#666;margin-top:-8px">Copy image address from any product on mova99.com and paste here.</div>
          <div><label class="field-label">Landing Page</label>
            <select id="push-landing" class="field-input" onchange="toggleCustomLanding(this.value)">
              <option value="/dashboard">Marketplace</option>
              <option value="/dashboard#orders">Orders</option>
              <option value="/signup">Sign Up</option>
              <option value="custom">Custom URL...</option>
            </select>
          </div>
          <div id="custom-landing-wrap" style="display:none">
            <label class="field-label">Custom URL</label>
            <input id="push-landing-custom" class="field-input" placeholder="e.g. /product?pid=2062590960497782785">
            <div style="font-size:10px;color:#666;margin-top:4px">Paste product URL or any mova99.com path</div>
          </div>
        </div>

        <div class="msg-box" id="push-msg"></div>
        <button onclick="sendPush()" class="btn btn-primary w-full">Send Custom Message 🔔</button>
      </div>
    </div>`;

  // Load subscriber count
  af('/api/push-notification?action=count').then(r => r.json()).then(d => {
    const el = document.getElementById('push-count');
    if (el) el.textContent = (d.count || 0).toLocaleString();
  }).catch(() => {
    const el = document.getElementById('push-count');
    if (el) el.textContent = '0';
  });
}

function toggleCustomLanding(val) {
  const wrap = document.getElementById('custom-landing-wrap');
  if (wrap) wrap.style.display = val === 'custom' ? 'block' : 'none';
}

const QUICK_MESSAGES = {
  morning:   { title: 'Morning Deals at Mova99 ☀️', body: 'Jewelry from $3.22 — flat $2.41 shipping anywhere in the USA! Shop now.', landing: '/dashboard' },
  afternoon: { title: 'Flash Sale Now Live! ⚡', body: 'Hot products from $8 with flat $2.41 shipping. Limited time only!', landing: '/dashboard' },
  evening:   { title: 'Tonight Best Deals 🌙', body: 'Shop jewelry, fashion and electronics at Mova99. Fast USA delivery!', landing: '/dashboard' },
  referral:  { title: 'Earn $15,000 Free 💸', body: 'Join Mova99 referral program. Earn 5% on every purchase. No investment needed!', landing: '/signup' }
};

function toggleCustomLanding(val) {
  const wrap = document.getElementById('custom-landing-wrap');
  if (wrap) wrap.style.display = val === 'custom' ? 'block' : 'none';
}

function getLanding() {
  const select = document.getElementById('push-landing');
  if (select?.value === 'custom') {
    return document.getElementById('push-landing-custom')?.value.trim() || '/dashboard';
  }
  return select?.value || '/dashboard';
}

async function quickSend(type) {
  const msg = QUICK_MESSAGES[type];
  if (!msg) return;
  document.getElementById('push-title').value = msg.title;
  document.getElementById('push-body').value = msg.body;
  document.getElementById('push-landing').value = msg.landing;
  await sendPush();
}

async function sendPush() {
  const title   = document.getElementById('push-title')?.value.trim();
  const body    = document.getElementById('push-body')?.value.trim();
  const landing = getLanding();
  const msg     = document.getElementById('push-msg');
  if (!title||!body) { showMsg(msg,'Fill in title and message.',false); return; }
  const btn = document.querySelector('[onclick="sendPush()"]');
  if (btn) { btn.textContent='Sending...'; btn.disabled=true; }
  try {
    const image = document.getElementById('push-image')?.value.trim() || '';
    const landingVal = landing === 'custom' 
      ? (document.getElementById('push-landing-custom')?.value.trim() || '/dashboard')
      : landing;
    const r = await af('/api/push-notification?action=send', {
      method:'POST', body:JSON.stringify({ title, body, landingPage:landingVal, image })
    });
    const d = await r.json();
    if (d.success) {
      showMsg(msg, `✓ Sent to ${d.sent||0} devices!`, true);
      document.getElementById('push-title').value='';
      document.getElementById('push-body').value='';
      document.getElementById('push-image').value='';
    } else showMsg(msg, d.error||'Failed', false);
  } catch(e) { showMsg(msg,'Network error',false); }
  if (btn) { btn.textContent='Send to All Users 🔔'; btn.disabled=false; }
}
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
